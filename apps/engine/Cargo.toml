[package]
name = "chess"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs", "api-24", "cuda"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
shakmaty = "0.26"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["cors"] }
