[package]
name = "chess"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs", "api-24", "cuda"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shakmaty = "0.30.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["cors"] }
